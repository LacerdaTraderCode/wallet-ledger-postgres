[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wallet-ledger-postgres"
version = "0.1.0"
description = "Double-entry wallet ledger on PostgreSQL: balanced transactions, holds, idempotency and an integrity audit."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "psycopg[binary,pool]>=3.2,<4",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx2>=2.15",
    "ruff>=0.6",
    "pgserver>=0.1.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
walletledger = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["walletledger"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
